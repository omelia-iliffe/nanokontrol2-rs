[package]
name = "nanokontrol2"
version = "0.1.0"
edition = "2024"
description = "Korg nanoKONTROL2 driver with typed events, LED control, and control state"
readme = "README.md"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
keywords = ["midi", "korg", "nanokontrol", "nanokontrol2", "controller"]
categories = ["multimedia::audio", "hardware-support"]

[features]
default = ["midir"]
midir = ["dep:midir"]

[dependencies]
midir = { version = "0.11", optional = true }

[dev-dependencies]
ctrlc = "3.4"

[[example]]
name = "monitor"
required-features = ["midir"]
